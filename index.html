<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Geo gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <h1>Geo gallery</h1>
  <p>Screenshots from GeoFS flights. Sunsets, bad landings, and the odd good one.</p>
</header>

<main class="wall">

  <figure>
    <img src="photos/a320-lisbon.jpg" width="1600" height="900" alt="An A320 on final approach into Lisbon">
    <figcaption><b>A320</b> on final into Lisbon, LPPT</figcaption>
  </figure>

  <figure>
    <img src="photos/c172-alps.jpg" width="1200" height="1600" alt="A Cessna 172 over snowy Alpine peaks">
    <figcaption><b>C172</b> over the Alps, late afternoon</figcaption>
  </figure>

  <figure>
    <img src="photos/b747-night.jpg" width="1600" height="900" alt="A 747 taking off at night">
    <figcaption><b>747</b> departing at night</figcaption>
  </figure>

  <figure>
    <img src="photos/f16-clouds.jpg" width="1600" height="1000" alt="An F-16 banking above a cloud layer">
    <figcaption><b>F-16</b> above the cloud deck</figcaption>
  </figure>

  <figure>
    <img src="photos/a380-sunset.jpg" width="1400" height="1400" alt="An A380 on the runway at sunset">
    <figcaption><b>A380</b> holding short, sunset</figcaption>
  </figure>

  <figure>
    <img src="photos/dash8-coast.jpg" width="1600" height="900" alt="A Dash 8 flying along a coastline">
    <figcaption><b>Dash 8</b> following the coast</figcaption>
  </figure>

</main>

<footer>
  <p>Screenshots taken in GeoFS. This site is not affiliated with GeoFS.</p>
</footer>

</body>
</html>
